plugins {
    id 'java'
}

repositories {
    maven { url "https://repo.osgeo.org/repository/release/" }
    mavenCentral()
}

dependencies {
    compileOnly "org.projectlombok:lombok:1.18.26"
    annotationProcessor "org.projectlombok:lombok:1.18.26"

    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    implementation('com.fasterxml.jackson.core:jackson-databind:2.12.7.1')
    implementation("com.fasterxml.jackson.core:jackson-core:2.15.0-rc2")

    implementation 'org.slf4j:slf4j-api:1.7.25'
    implementation 'commons-logging:commons-logging:1.2'
    implementation 'org.apache.logging.log4j:log4j-core:2.17.1'
    implementation 'org.apache.logging.log4j:log4j-api:2.14.0'
    implementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.14.0'

    implementation("org.joml:joml:1.10.5")
    implementation("commons-cli:commons-cli:1.5.0")

    implementation 'org.geotools:gt-geojsondatastore:21.3'
    implementation "org.geotools:gt-referencing:21.3"
    implementation "org.geotools:gt-epsg-wkt:21.3"

    testCompileOnly "org.projectlombok:lombok:1.18.26"
    testAnnotationProcessor "org.projectlombok:lombok:1.18.26"

    implementation "org.locationtech.proj4j:proj4j:1.2.3"
    implementation "org.locationtech.proj4j:proj4j-epsg:1.2.3"
}

test {
    //useJUnitPlatform()
}

jar {
    manifest {
        attributes "Main-Class": "com.gaia3d.Main"
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}